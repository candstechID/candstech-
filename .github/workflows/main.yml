name: Build CANDS TECH APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/*.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project ZIP
        run: |
          mkdir source
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d source

      - name: Auto-Fix Semua Kode (Wajib Berhasil)
        run: |
          APP_GRADLE=$(find source -type f -name 'build.gradle.kts' -path '*/app/*' -print -quit)
          APP_DIR=$(dirname "$APP_GRADLE")
          PROJECT_DIR=$(dirname "$APP_DIR")
          
          # 1. Suntik repositori JitPack ke settings.gradle.kts
          cat << 'EOF' > "$PROJECT_DIR/settings.gradle.kts"
          pluginManagement {
              repositories {
                  google {
                      content {
                          includeGroupByRegex("com\\.android.*")
                          includeGroupByRegex("com\\.google.*")
                          includeGroupByRegex("androidx.*")
                      }
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = java.net.URI("https://jitpack.io") }
              }
          }
          rootProject.name = "ECUReaderProFTDI"
          include(":app")
          EOF
          
          # 2. Suntik versi Plugin dan USB Serial ke app/build.gradle.kts
          cat << 'EOF' > "$APP_DIR/build.gradle.kts"
          plugins {
              id("com.android.application") version "8.7.3"
              id("org.jetbrains.kotlin.android") version "2.0.21"
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21"
          }
          android {
              namespace = "com.cands.ecureader"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.cands.ecureader"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
                  vectorDrawables {
                      useSupportLibrary = true
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.datastore:datastore-preferences:1.1.1")
              implementation("com.google.android.gms:play-services-location:21.3.0")
              implementation("com.github.felhr85:UsbSerial:6.1.0")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF
          
          # 3. Suntik perbaikan kode K-Line
          KLINE_FILE=$(find "$APP_DIR" -type f -name 'HondaKLineManager.kt' -print -quit)
          if [ -n "$KLINE_FILE" ]; then
            cat << 'EOF' > "$KLINE_FILE"
          package com.cands.ecureader.data
          import android.hardware.usb.UsbDevice
          import android.hardware.usb.UsbDeviceConnection
          import android.hardware.usb.UsbManager
          import android.util.Log
          import com.felhr85.usbserial.UsbSerialDevice
          import com.felhr85.usbserial.UsbSerialInterface
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext

          class HondaKLineManager(private val usbManager: UsbManager) {
              private var serialDevice: UsbSerialDevice? = null
              private var connection: UsbDeviceConnection? = null
              var isConnected: Boolean = false
                  private set
              suspend fun connect(device: UsbDevice): Boolean = withContext(Dispatchers.IO) {
                  try {
                      connection = usbManager.openDevice(device)
                      if (connection == null) return@withContext false
                      val deviceInstance = UsbSerialDevice.createUsbSerialDevice(device, connection)
                      serialDevice = deviceInstance
                      if (deviceInstance == null || !deviceInstance.open()) {
                          connection?.close()
                          return@withContext false
                      }
                      deviceInstance.setBaudRate(10400)
                      deviceInstance.setDataBits(UsbSerialInterface.DATA_BITS_8)
                      deviceInstance.setStopBits(UsbSerialInterface.STOP_BITS_1)
                      deviceInstance.setParity(UsbSerialInterface.PARITY_NONE)
                      deviceInstance.setFlowControl(UsbSerialInterface.FLOW_CONTROL_OFF)
                      performHondaFastInit(deviceInstance)
                      isConnected = true
                      true
                  } catch (e: Exception) {
                      Log.e("HondaKLineManager", "Connection error", e)
                      disconnect()
                      false
                  }
              }
              private suspend fun performHondaFastInit(device: UsbSerialDevice) = withContext(Dispatchers.IO) {
                  try {
                      device.setBreak(true)
                      kotlinx.coroutines.delay(25)
                      device.setBreak(false)
                      kotlinx.coroutines.delay(25)
                      Log.d("HondaKLineManager", "Honda Fast Init completed successfully.")
                  } catch (e: Exception) {
                      Log.e("HondaKLineManager", "Fast init failed", e)
                  }
              }
              suspend fun sendCommand(hexCommand: String): ByteArray? = withContext(Dispatchers.IO) {
                  val device = serialDevice
                  if (!isConnected || device == null) return@withContext null
                  try {
                      val bytes = hexStringToByteArray(hexCommand)
                      device.syncWrite(bytes, 1000)
                      val buffer = ByteArray(64)
                      val n = device.syncRead(buffer, 500)
                      if (n > 0) {
                          return@withContext buffer.copyOfRange(0, n)
                      }
                  } catch (e: Exception) {
                      Log.e("HondaKLineManager", "Command error: $hexCommand", e)
                  }
                  return@withContext null
              }
              fun disconnect() {
                  try {
                      serialDevice?.close()
                      connection?.close()
                  } catch (_: Exception) {}
                  serialDevice = null
                  connection = null
                  isConnected = false
              }
              private fun hexStringToByteArray(s: String): ByteArray {
                  val clean = s.replace(" ", "")
                  val len = clean.length
                  val data = ByteArray(len / 2)
                  var i = 0
                  while (i < len) {
                      data[i / 2] = ((Character.digit(clean[i], 16) shl 4) + Character.digit(clean[i + 1], 16)).toByte()
                      i += 2
                  }
                  return data
              }
          }
          EOF
          fi

      - name: Build debug APK
        run: |
          GRADLE_FILE=$(find source -type f -name 'build.gradle.kts' -path '*/app/*' -print -quit)
          test -n "$GRADLE_FILE"
          APP_DIR=$(dirname "$GRADLE_FILE")
          PROJECT_DIR=$(dirname "$APP_DIR")
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CANDSTECH-DIAG-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
