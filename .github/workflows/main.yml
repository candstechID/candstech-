name: Build CANDS TECH APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.kt'
      - '**.kts'
      - '.github/workflows/*.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          # Cari lokasi build.gradle atau settings.gradle secara otomatis di repository
          GRADLE_ROOT=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" -print -quit)
          PROJECT_DIR=$(dirname "$GRADLE_ROOT")
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CANDSTECH-DIAG-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
