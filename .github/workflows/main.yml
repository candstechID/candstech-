name: Build CANDS TECH APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/*.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project ZIP
        run: |
          mkdir source
          # Mencari file ZIP di root repository dan mengekstraknya
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          if [ -n "$ZIP_FILE" ]; then
            echo "Mengekstrak $ZIP_FILE..."
            unzip -q "$ZIP_FILE" -d source
          else
            echo "Error: File ZIP proyek tidak ditemukan!"
            exit 1
          fi

      - name: Build debug APK
        run: |
          # Mencari lokasi file build.gradle.kts di dalam folder hasil ekstrak
          GRADLE_FILE=$(find source -type f -name 'build.gradle.kts' -path '*/app/*' -print -quit)
          if [ -n "$GRADLE_FILE" ]; then
            APP_DIR=$(dirname "$GRADLE_FILE")
            PROJECT_DIR=$(dirname "$APP_DIR")
            echo "Berpindah ke direktori proyek: $PROJECT_DIR"
            cd "$PROJECT_DIR"
            
            # Eksekusi build APK
            gradle assembleDebug --stacktrace
          else
            echo "Error: Struktur proyek Gradle tidak ditemukan di dalam ZIP."
            exit 1
          fi

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CANDSTECH-DIAG-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
