name: Build Candstech Diag from uploaded ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '*.zip'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Candstech Diag source ZIP
        id: srczip
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          ZIP_FILE=""

          # Mencari file ZIP yang sesuai dengan nama candstech_diag atau zip apa pun di root
          for candidate in \
            "$ROOT/ECU_Reader_Clean_Build.zip" \
            "$ROOT/candstech_diag.zip" \
            "$ROOT/candstech_diag_full.zip"; do
            if [ -f "$candidate" ]; then ZIP_FILE="$candidate"; break; fi
          done

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find "$ROOT" -maxdepth 1 -type f -iname '*.zip' -print | head -n 1 || true)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Tidak ditemukan ZIP candstech_diag di root repository. Unggah file ZIP ke halaman Code, bukan ke dalam folder."
            echo "Isi root repository:"
            ls -la "$ROOT"
            exit 1
          fi

          echo "Menggunakan source ZIP: $(basename "$ZIP_FILE")"
          echo "file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract source ZIP on runner
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/candstech-src"
          mkdir -p "$DEST"
          unzip -q "${{ steps.srczip.outputs.file }}" -d "$DEST"

          if [ -f "$DEST/settings.gradle.kts" ]; then
            SRC_DIR="$DEST"
          else
            SETTINGS_FILE="$(find "$DEST" -mindepth 2 -maxdepth 5 -type f -name settings.gradle.kts -print -quit)"
            if [ -z "$SETTINGS_FILE" ]; then
              echo "::error::settings.gradle.kts tidak ditemukan dalam ZIP. Pastikan struktur ZIP benar."
              find "$DEST" -maxdepth 3 -type f | head -n 80
              exit 1
            fi
            SRC_DIR="$(dirname "$SETTINGS_FILE")"
          fi
          echo "SRC_DIR=$SRC_DIR" >> "$GITHUB_ENV"

      - name: Locate Android SDK and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "::error::Android SDK tidak tersedia pada runner."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Generate Gradle Wrapper if missing
        shell: bash
        working-directory: ${{ env.SRC_DIR }}
        run: |
          set -euo pipefail
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x ./gradlew

      - name: Build debug APK (Clean & Bypass Cache)
        shell: bash
        working-directory: ${{ env.SRC_DIR }}
        run: ./gradlew clean assembleDebug --no-configuration-cache

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: candstech-diag-debug-apk
          path: ${{ env.SRC_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
